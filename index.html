<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Netflix</title>
</head>

<body>
    <div class= "caixa-principal">

      <div class="menu-superior">        
        <img src="/src/assets/Netflix_2015_logo.png" alt="Netflix Logo" width="150">
            
            <div class="nav">
            <select name="idioma" id="idioma">
                <option value="portugues">Português</option>
                <option value="ingles">Inglês</option>
                <option value="espanhol">Espanhol</option>
            </select>
            <button type="button">Entrar</button>
            </div>
      </div>

       <div class="caixa-imagem">
            <img src="/src/assets/fundo netflix.jpg" alt="Fundo Netflix">
             <div class="caixa-secundaria">
                <h1 id="principal">Filmes, séries e
                                <br> muito mais, sem
                                <br> limites</h1>
                <h3 id="valor-mensal">A partir de R$ 20,90. Cancele quando quiser.</h3>
                <h5 id="quer-assistir">Quer assistir? Informe seu email para criar ou reiniciar sua assinatura.</h5>
                <form id="login-form" action="login.html" method="get">
                    <input type="email" id="email" placeholder="Digite seu e-mail" name="email" required>
                    <br><br>
                    <button id="submit" type="submit">Vamos lá &gt;</button>
                </form>
             </div> 

        </div>
    </div>
</body>
</html>
